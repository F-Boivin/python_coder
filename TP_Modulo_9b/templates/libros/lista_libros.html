<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Libros</title>
</head>
<body>
    <h1>Lista de Libros</h1>
    <ul>
        {% for libro in libros %}
            <li><a href="{% url 'detalle_libro' libro.pk %}">{{ libro.titulo }}</a> - {{ libro.autor }}</li>
        {% empty %}
            <li>No hay libros disponibles.</li>
        {% endfor %}
    </ul>
</body>
</html>
