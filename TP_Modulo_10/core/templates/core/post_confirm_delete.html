{% extends 'base.html' %}

{% block title %}Eliminar post — Workshop Blog{% endblock %}

{% block content %}
    <h1>¿Eliminar post?</h1>
    <p>Estás a punto de eliminar <strong>"{{ post.title }}"</strong>. Esta acción no se puede deshacer.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'core:post-detail' post.pk %}" class="btn btn-secondary">Cancelar</a>
    </form>
{% endblock %}
