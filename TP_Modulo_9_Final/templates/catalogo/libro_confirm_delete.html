{% extends 'base.html' %}

{% block title %}Eliminar libro — Biblioteca{% endblock %}

{% block content %}
    <h1>¿Eliminar libro?</h1>
    <p>Estás a punto de eliminar <strong>"{{ libro.titulo }}"</strong> de {{ libro.autor }}. Esta acción no se puede deshacer.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'libro-detail' libro.pk %}" class="btn btn-secondary">Cancelar</a>
    </form>
{% endblock %}
